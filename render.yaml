# Blueprint de Render — https://render.com/docs/blueprint-spec
#
# En Render: New > Blueprint > conecta este repositorio.
# Los valores con `sync: false` NO se guardan aquí: los pegas una sola vez
# en el panel de Render (Environment) y quedan cifrados fuera del repositorio.

services:
  # ─── API (NestJS) ────────────────────────────────────────────────────
  - type: web
    name: cj7-ia-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Render inyecta PORT automáticamente; main.ts lo respeta.
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto aleatorio la 1ª vez
      - key: JWT_EXPIRES_IN
        value: 1d
      # URL publica del frontend, CON https:// y sin barra final.
      # Render solo sabe devolver el host pelado (sin esquema) via fromService,
      # asi que esta se pega a mano una vez.
      - key: FRONTEND_URLS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: cj7-productos
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OWNER_EMAIL
        sync: false

  # ─── Frontend (Next.js) ──────────────────────────────────────────────
  - type: web
    name: cj7-ia-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NEXT_PUBLIC_* se incrusta en el bundle durante el build, asi que
      # tiene que estar definida ANTES de compilar (Render ya lo hace asi).
      # Valor: la URL del backend, con https:// y sin barra final.
      - key: NEXT_PUBLIC_API_URL
        sync: false
